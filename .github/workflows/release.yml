name: Release

# 推 v* tag 触发，打包 VS Code 插件并创建 Draft Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Package VSIX
        run: pnpm run package

      # 从 CHANGELOG.md 提取最新版本块，作为 GitHub Release 正文。
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          awk '/^## \[/{n++; if(n==2) exit} n==1 && !/^## \[/' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          body_path: /tmp/release-notes.md
          files: dist/*.vsix
