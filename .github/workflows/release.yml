name: Release

# 推 v* tag 触发，打包 VS Code 插件并创建公开 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Package VSIX
        run: pnpm run package

      # 从 CHANGELOG.md 提取最新版本块，作为 GitHub Release 正文。
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          awk '/^## \[/{n++; if(n==2) exit} n==1 && !/^## \[/' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat /tmp/release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: /tmp/release-notes.md
          files: dist/*.vsix

      - name: Sync Gitee release
        uses: nicennnnnnnlee/action-gitee-release@master
        with:
          gitee_action: create_release
          gitee_owner: vvvon
          gitee_repo: reclaude-monitor
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.ref_name }}
          gitee_release_name: Reclaude Monitor ${{ github.ref_name }}
          gitee_release_body: ${{ steps.notes.outputs.body }}
          gitee_target_commitish: ${{ github.sha }}
          gitee_upload_retry_times: 3
          gitee_files: dist/*.vsix
